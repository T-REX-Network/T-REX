[profile.default]
src = "contracts"
out = "out"
script = "scripts"
test = "test"
libs = ["dependencies"]

# scripts/DeployUtilityChecker.s.sol reads and merges the network deployment manifest.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    # scratch manifest for test/unit/scripts/DeployUtilityChecker.t.sol
    { access = "read-write", path = "./cache" },
    # scripts/SeedActivity.s.sol and scripts/SeedGoldToken.s.sol append the identities they
    # create to the sibling ONCHAINID checkout's deployment log.
    { access = "read-write", path = "../ONCHAINID/deployments" },
]

solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"

[profile.default.fuzz]
runs = 2000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false

# Fast profile used by the Gambit mutation-testing runner (mutation/run_mutation.sh).
# Reduced fuzz/invariant budgets keep per-mutant wall-clock low while still exercising
# the randomized harnesses that catch arithmetic/logic mutants the unit tests miss.
[profile.mutation]
via_ir = false
[profile.mutation.fuzz]
runs = 96
[profile.mutation.invariant]
runs = 24
depth = 48
fail_on_revert = false
call_override = false

[profile.default.fmt]
sort_imports = true
contract_new_lines = true
bracket_spacing = true

[profile.default.lint]
lint_on_build = true
ignore = ["test/**/*.sol"]
exclude_lints = [ "mixed-case-function", "mixed-case-variable", "pascal-case-struct" ]

[soldeer]
remappings_regenerate = false

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.7.0"
"@openzeppelin-contracts-upgradeable" = "5.7.0"
# A develop merge commit, not a release tag. The v5 audit froze T-REX at `audit-2026-09-28`, whose pin was
# `edcc9f3`; this moves past it, so `4935eb1` (ONCHAINID #97) belongs in the diff-pass scope the auditors
# were given, and the freeze tag needs recutting against this pin.
# TODO: repin to the ONCHAINID v3 release tag once it is cut, and drop this note with it.
onchain-id = { version = "develop", git = "https://github.com/T-REX-Network/ONCHAINID.git", rev = "2180c91966bfc0bea921de758395fa753e84b14f" }

[rpc_endpoints]
ethereum = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
polygon = "https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
baseSepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"


[etherscan]
baseSepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
