[profile.default]
src = "contracts"
out = "out"
test = "test"
libs = ["dependencies"]
script = "scripts"

solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "deployments" }]

[profile.default.fuzz]
runs = 2000

[profile.default.fmt]
sort_imports = true
contract_new_lines = true
bracket_spacing = true

[profile.default.lint]
lint_on_build = true
ignore = [ "test/**/*" ]
exclude_lints = [ "mixed-case-function", "mixed-case-variable", "pascal-case-struct" ]

[soldeer]
remappings_regenerate = false

[dependencies]
forge-std = { version = "v1.14.0", git = "https://github.com/foundry-rs/forge-std.git", tag = "v1.14.0" }
"@openzeppelin-contracts" = "5.5.0"
"@openzeppelin-contracts-upgradeable" = "5.5.0"
onchain-id = { version = "custom", git = "https://github.com/onchain-id/solidity.git", branch = "bt-1372-factory-create3" }
createx = { version = "main", git = "https://github.com/TokenySolutions/createx.git", branch = "main" }
chainlink-ccip = { version = "1.6.4", git = "https://github.com/smartcontractkit/chainlink-ccip.git", rev = "contracts-ccip-v1.6.4" }
chainlink = { version = "1.5", git = "https://github.com/smartcontractkit/chainlink-evm.git", rev = "contracts-v1.5.0" }

[rpc_endpoints]
baseSepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"

