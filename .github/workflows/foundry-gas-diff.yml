name: Report gas diff

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    paths:
      - contracts/**
      - .github/workflows/foundry-gas-diff.yml

env:
  HUSKY: 0

jobs:
  compare_gas_reports:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: forge soldeer install

      - name: Run tests
        run: forge test --gas-report > gasreport.ansi
        env:
          FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}

      - name: Compare gas reports
        uses: Rubilmax/foundry-gas-diff@v3
        with:
          summaryQuantile: 0.9
          sortCriteria: avg,max
          sortOrders: desc,asc
          ignore: test/**/*
        id: gas_diff

      - name: Add gas diff to job summary
        env:
          GAS_DIFF_MARKDOWN: ${{ steps.gas_diff.outputs.markdown }}
        run: |
          if [ -n "$GAS_DIFF_MARKDOWN" ]; then
            printf '%s\n' "$GAS_DIFF_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'No gas diff report was produced; see the comparison step for details.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add gas diff to sticky comment
        # Keep fork and Dependabot reports available without requiring comment permissions.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          # delete the comment in case changes no longer impact gas costs
          delete: ${{ !steps.gas_diff.outputs.markdown }}
          message: ${{ steps.gas_diff.outputs.markdown }}
