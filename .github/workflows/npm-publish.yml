name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24 # Trusted Publishing needs npm >= 11.5.1
          registry-url: https://registry.npmjs.org
          scope: '@t-rex-network'

      - name: Install dependencies
        run: forge soldeer install

      - name: Build contracts
        run: forge build

      - name: Set version from release tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version --ignore-scripts
        env:
          TAG: ${{ github.event.release.tag_name }}

      # Authenticates via OIDC (Trusted Publisher configured on npmjs.com); no NPM_TOKEN needed.
      - name: Publish to npm
        run: npm publish --ignore-scripts --provenance --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}
