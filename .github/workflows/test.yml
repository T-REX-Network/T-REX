name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci
  ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
  HUSKY: 0

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: forge soldeer install

      - name: Show Forge version
        run: forge --version

      - name: Run Linter
        run: forge fmt --check
        id: lint

      # Use `_msgData()`, not raw `msg.data`, to stay ERC-2771 safe.
      - name: Check no raw msg.data in contracts
        run: "! grep -rn 'msg\\.data' contracts/"
        id: msg-data

      # Fails if a contract in forge's size table exceeds EIP-170 (runtime) or EIP-3860 (initcode).
      - name: Run build
        run: forge build --sizes contracts
        id: build

      # Forge's size table leaves out every contract with no function in its ABI, such as a linked library whose
      # functions all take `storage` parameters. This step reads the build output and checks every contract.
      - name: Check the size of every contract, linked libraries included
        run: bash scripts/check-contract-sizes.sh
        id: all-sizes

      # ONCHAINID ships with via-IR; under T-REX's profile IdentityFactory is over EIP-170 and the step above
      # never lists it. Build the eight ONCHAINID contracts the deployment uses the way they ship (`onchainid`
      # profile, out-onchainid/), so the size gate sees them and the deployment tooling tests can read them.
      - name: Build ONCHAINID (via-IR) and check its sizes
        run: >-
          FOUNDRY_PROFILE=onchainid forge build --sizes
          dependencies/onchain-id-develop/contracts/factory/IdentityFactory.sol
          dependencies/onchain-id-develop/contracts/Identity.sol
          dependencies/onchain-id-develop/contracts/IdentityUtilities.sol
          dependencies/onchain-id-develop/contracts/proxy/IdentityUtilitiesProxy.sol
          dependencies/onchain-id-develop/contracts/modules/validators/ERC734Validator.sol
          dependencies/onchain-id-develop/contracts/modules/executors/KeyApprovalModule.sol
          dependencies/onchain-id-develop/contracts/reputation/ReputationRegistry.sol
          dependencies/@openzeppelin-contracts-5.7.0/utils/cryptography/verifiers/ERC7913WebAuthnVerifier.sol
        id: identity-factory-size

      # The deployment tooling tests skip without the build above; here a skip is a failure.
      - name: Run tests
        run: forge test
        id: test
        env:
          TREX_REQUIRE_DEPLOY_TESTS: "true"

      # Coverage builds without the optimizer, and OpenZeppelin's P256 verifier then runs out of stack.
      # The WebAuthn issuer test deploys that verifier, so coverage skips it; `forge test` above still runs it.
      - name: Run coverage
        run: forge coverage --no-match-coverage "(test|dependencies|scripts|vendor)" --skip HeaviestHonestClaimIssuer
        id: coverage
        env:
          TREX_REQUIRE_DEPLOY_TESTS: "true"
