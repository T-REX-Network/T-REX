name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci
  ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
  HUSKY: 0

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: forge soldeer install

      - name: Show Forge version
        run: forge --version

      - name: Run Linter
        run: forge fmt --check
        id: lint

      - name: Run tests
        run: forge test --gas-report
        id: test

      - name: Run coverage
        run: forge coverage --no-match-coverage "(test|dependencies|scripts)"
        id: coverage
