name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci
  ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
  HUSKY: 0

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: forge soldeer install

      - name: Show Forge version
        run: forge --version

      - name: Run Linter
        run: forge fmt --check
        id: lint

      # Use `_msgData()`, not raw `msg.data`, to stay ERC-2771 safe.
      - name: Check no raw msg.data in contracts
        run: "! grep -rn 'msg\\.data' contracts/"
        id: msg-data

      # Fails if any contract under contracts/ exceeds EIP-170 (runtime) or EIP-3860 (initcode).
      - name: Run build
        run: forge build --sizes contracts
        id: build

      # ONCHAINID deploys IdentityFactory with via-IR; under T-REX's profile it is over EIP-170 and the
      # step above never lists it. Build it the way it ships so the gate sees it.
      - name: Check IdentityFactory size under its own profile
        run: forge build --sizes --via-ir dependencies/onchain-id-develop/contracts/factory/IdentityFactory.sol
        id: identity-factory-size

      - name: Run tests
        run: forge test
        id: test

      # Coverage builds without the optimizer, and OpenZeppelin's P256 verifier then runs out of stack.
      # The WebAuthn issuer test deploys that verifier, so coverage skips it; `forge test` above still runs it.
      - name: Run coverage
        run: forge coverage --no-match-coverage "(test|dependencies|scripts|vendor)" --skip HeaviestHonestClaimIssuer
        id: coverage
